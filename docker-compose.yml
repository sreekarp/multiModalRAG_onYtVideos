version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ytrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: ytrag-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # HF_TOKEN is no longer needed as we use local models
      # GROQ_API_KEY is passed at runtime
    depends_on:
      - qdrant
    volumes:
      - ./backend/data:/app/data # Persist data/video/audio locally if needed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytrag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  qdrant_data:
