version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: ytrag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: ninja19/ytrag-backend:latest
    container_name: ytrag-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data # Persist data locally

  frontend:
    image: ninja19/ytrag-frontend:latest
    container_name: ytrag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  qdrant_data:
